[project]
name = "monster-adjustment"
version = "1.0.0"
description = "Decomposing Roki Sasaki's NPB-to-MLB transition, with Yoshinobu Yamamoto as a matched control."
requires-python = ">=3.13"
dependencies = [
    "pybaseball>=2.2.7",
    "pandas>=3.0",
    "numpy>=2.5",
    "pyarrow>=25.0",
    "matplotlib>=3.11",
    "statsmodels>=0.15",
    "requests>=2.34",
    "jupyterlab>=4.6",
    "ipykernel>=7.4",
    "nbformat>=5.11",
    "nbconvert>=7.17",
]

[tool.uv]
package = false
